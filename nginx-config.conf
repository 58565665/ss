# Nginx configuration for zerothelegend.gamer.gd
# Proxy WebSocket da http://zerothelegend.gamer.gd/games/zerolegend/ a Node.js porta 3001

upstream game_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    server_name zerothelegend.gamer.gd;

    # Root della applicazione web (se hai una pagina HTML)
    root /home/zero/ss/public;
    index index.html;

    # Proxy per WebSocket e API
    location /games/zerolegend/ {
        proxy_pass http://game_backend/;
        proxy_http_version 1.1;
        
        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Headers standard
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts per WebSocket
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        
        # Buffering
        proxy_buffering off;
    }

    # Proxy per le altre route (se necessarie)
    location /api/ {
        proxy_pass http://game_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve file statici
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
