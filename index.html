<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Zero The Legend</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #050508; font-family: sans-serif; }
        canvas { display: block; }
        
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); z-index: 10; }
        .panel { background: #111; border: 2px solid #00f3ff; border-radius: 10px; padding: 30px; width: 350px; text-align: center; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); color: white; }
        .logo { font-size: 28px; font-weight: bold; color: #00f3ff; margin-bottom: 20px; text-shadow: 0 0 10px #00f3ff; }
        
        input { width: 90%; padding: 10px; margin: 10px 0; background: #000; border: 1px solid #555; color: white; border-radius: 5px; outline: none; }
        input:focus { border-color: #00f3ff; }
        input[type="color"] { height: 40px; padding: 2px; cursor: pointer; }
        
        button { width: 100%; padding: 10px; margin: 5px 0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        #loginBtn { background: #ffd54d; color: black; }
        #registerBtn { background: #39ff14; color: black; }
        #playBtn { background: #00f3ff; color: black; margin-top: 15px; font-size: 20px; padding: 15px; }
        button:hover { filter: brightness(1.2); }
        
        #authMessage { font-size: 14px; min-height: 20px; margin: 10px 0; }
        #loggedInInfo { display: none; margin-bottom: 20px; border: 1px solid #39ff14; padding: 10px; border-radius: 5px; background: rgba(57, 255, 20, 0.1); }
        #logoutBtn { background: transparent; border: 1px solid #ff3333; color: #ff3333; padding: 5px; margin-top: 10px; font-size: 12px; }
        
        #hud { position: absolute; top: 10px; left: 10px; color: white; z-index: 5; font-size: 20px; text-shadow: 1px 1px 2px black; display: none; }
    </style>
</head>
<body>

    <div id="hud">Massa: <span id="massDisplay">20</span></div>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div class="panel">
            <div class="logo">ZERO THE LEGEND</div>
            
            <!-- Info Utente (Nascosto se non loggato) -->
            <div id="loggedInInfo">
                Connesso come: <b id="dispName" style="color:#39ff14"></b><br>
                Livello <span id="dispLevel"></span> | Best: <span id="dispBest"></span>
                <button id="logoutBtn">Logout</button>
            </div>

            <!-- Form Login/Register (Nascosto se loggato) -->
            <div id="authForms">
                <input type="text" id="username" placeholder="Username" autocomplete="off">
                <input type="password" id="password" placeholder="Password">
                <div style="display: flex; gap: 10px;">
                    <button id="loginBtn">Login</button>
                    <button id="registerBtn">Registrati</button>
                </div>
                <div id="authMessage"></div>
                <hr style="border-color: #333; margin: 15px 0;">
            </div>

            <input type="color" id="colorPicker" value="#00f3ff">
            <button id="playBtn">GIOCA</button>
        </div>
    </div>

    <script>
        // --- LOGICA AUTENTICAZIONE ---
        const ui = document.getElementById('ui');
        const authForms = document.getElementById('authForms');
        const loggedInInfo = document.getElementById('loggedInInfo');
        const msg = document.getElementById('authMessage');
        
        let currentUser = null;

        function checkAuth() {
            const token = localStorage.getItem('zl_token');
            const name = localStorage.getItem('zl_name');
            if (token && name) {
                currentUser = { token, name };
                authForms.style.display = 'none';
                loggedInInfo.style.display = 'block';
                document.getElementById('dispName').innerText = name;
                document.getElementById('dispLevel').innerText = localStorage.getItem('zl_level') || 1;
                document.getElementById('dispBest').innerText = localStorage.getItem('zl_best') || 0;
            } else {
                authForms.style.display = 'block';
                loggedInInfo.style.display = 'none';
                currentUser = null;
            }
        }
        checkAuth();

        document.getElementById('registerBtn').onclick = async () => {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if(!user || !pass) return msg.innerText = "Inserisci dati!";
            
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();
            msg.style.color = res.ok ? "#39ff14" : "#ff3333";
            msg.innerText = data.message || data.error;
        };

        document.getElementById('loginBtn').onclick = async () => {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if(!user || !pass) return msg.innerText = "Inserisci dati!";
            
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();
            
            if (res.ok) {
                localStorage.setItem('zl_token', data.token);
                localStorage.setItem('zl_name', data.username);
                localStorage.setItem('zl_level', data.level);
                localStorage.setItem('zl_best', data.bestMass);
                checkAuth();
            } else {
                msg.style.color = "#ff3333";
                msg.innerText = data.error;
            }
        };

        document.getElementById('logoutBtn').onclick = () => {
            localStorage.clear();
            checkAuth();
        };


        // --- LOGICA GIOCO ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let ws;
        let myId = null;
        let gameState = { players: {}, foods: [] };
        
        let mouseX = 0, mouseY = 0;
        let cameraX = 0, cameraY = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        document.getElementById('playBtn').onclick = () => {
            ui.style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            
            const name = currentUser ? currentUser.name : "Guest_" + Math.floor(Math.random()*100);
            const color = document.getElementById('colorPicker').value;

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                // Modifica qui in basso con il tuo IP o Dominio se lo pubblichi online
                ws = new WebSocket('ws://' + window.location.host); 
                
                ws.onopen = () => {
                    ws.send(JSON.stringify({ t: 'join', name, color }));
                };

                ws.onmessage = (e) => {
                    const data = JSON.parse(e.data);
                    if (data.t === 'init') myId = data.id;
                    if (data.t === 'update') gameState = data;
                };

                ws.onclose = () => {
                    alert("Disconnesso dal server.");
                    window.location.reload();
                };
            } else {
                ws.send(JSON.stringify({ t: 'respawn', name, color }));
            }
        };

        window.addEventListener('mousemove', (e) => {
            if (!myId || !gameState.players[myId]) return;
            // Calcola la posizione globale del mouse sommando la camera
            const targetX = e.clientX - canvas.width / 2 + cameraX;
            const targetY = e.clientY - canvas.height / 2 + cameraY;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ t: 'mouse', x: targetX, y: targetY }));
            }
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let me = gameState.players[myId];
            if (me) {
                // Aggiorna camera e HUD
                cameraX = me.x;
                cameraY = me.y;
                document.getElementById('massDisplay').innerText = Math.floor(me.r);
            }

            ctx.save();
            // Trasla il mondo rispetto al giocatore (Camera)
            ctx.translate(canvas.width / 2 - cameraX, canvas.height / 2 - cameraY);

            // Disegna griglia di sfondo
            ctx.strokeStyle = "rgba(0, 243, 255, 0.1)";
            for(let x = 0; x < 3000; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 3000); ctx.stroke();
            }
            for(let y = 0; y < 3000; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(3000, y); ctx.stroke();
            }
            
            // Bordi mappa
            ctx.strokeStyle = "red";
            ctx.strokeRect(0, 0, 3000, 3000);

            // Disegna Cibo
            gameState.foods.forEach(f => {
                ctx.fillStyle = f.color;
                ctx.beginPath();
                ctx.arc(f.x, f.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Disegna Giocatori
            Object.values(gameState.players).forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                
                // Bordo neon
                ctx.lineWidth = 3;
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.stroke();

                // Nome
                ctx.fillStyle = "white";
                ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(p.name, p.x, p.y + 5);
            });

            ctx.restore();
            requestAnimationFrame(draw);
        }
        
        draw();
    </script>
</body>
</html>
