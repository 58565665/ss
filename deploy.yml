name: Deploy to Netsons via FTP

on:
  push:
    branches:
      - main   # cambia se usi un altro branch, es. master

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./           # cartella locale da caricare
          server-dir: /public_html/   # cartella di destinazione su Netsons
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
